name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql
          coverage: none

      - name: Lint PHP
        run: find app scripts public database -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Preflight
        run: php scripts/preflight.php
