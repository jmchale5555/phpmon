<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www>
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>

    # AllowOverride All so the dev container uses the exact same
    # public/.htaccess rewrite rules as shared hosting. This keeps the
    # local and production routing paths identical.
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
